// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Redirect library module build dirs outside OneDrive to prevent sync locking during builds.
  // The :app module is kept in-place so Expo CLI can find the APK at the standard path.
  if (project.path != ':' && project.path != ':app') {
    buildDir = new File("C:/gradle-build/${project.name}/build")
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
